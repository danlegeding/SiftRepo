name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: "12345"
          POSTGRES_DB: siftrepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d siftrepo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI 只跑不花钱的用例：LLM/embedding 都被 stub，key 用占位符
      DB_URL: postgres://user:12345@127.0.0.1:5432/siftrepo
      DEEPSEEK_API_KEY: dummy-key-for-ci
      CLOSEAI_API_KEY: dummy-key-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 启用 pgvector 扩展
        env:
          PGPASSWORD: "12345"
        run: psql -h 127.0.0.1 -U user -d siftrepo -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: 语法检查（编译全部模块）
        run: python -m compileall -q app frontend tests scripts

      - name: 单元测试 + 接口契约测试
        run: pytest -q
